{% extends 'layout.html' %} 
{% block body %}

<div class="container result-container" data-aos="zoom-in" data-aos-duration="1000">
  <div class="result-card">
    <i class="fa fa-leaf recommendation-icon"></i>
    <h1>You should grow <i>{{ prediction }}</i> in your farm</h1>
    <div class="mt-4">
      <a href="{{ url_for('crop_recommend') }}" class="btn btn-light back-btn">Predict Again</a>
      <a href="{{ url_for('crop_history') }}" class="btn btn-success ml-2">
        <i class="fa fa-history"></i> View History
      </a>
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary ml-2">
        <i class="fa fa-dashboard"></i> Dashboard
      </a>
    </div>
  </div>
</div>

{% endblock %}
