{% extends 'layout.html' %} 
{% block body %}

<div class="container result-container" data-aos="zoom-in" data-aos-duration="1000">
  <div class="result-card">
    <i class="fa fa-bug recommendation-icon"></i>
    <h1>Detected Disease:</h1>
    <h2><i>{{ prediction_class }}</i></h2>
    
    <h3>Confidence: <span style="color: green;">{{ confidence }}%</span></h3>

    <h4>Remedy:</h4>
    <p>{{ prediction | safe }}</p>
    <div class="mt-4">
      <a href="{{ url_for('disease_page') }}" class="btn btn-light back-btn">Try Another Image</a>
      <a href="{{ url_for('disease_history') }}" class="btn btn-danger ml-2">
        <i class="fa fa-history"></i> View History
      </a>
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary ml-2">
        <i class="fa fa-dashboard"></i> Dashboard
      </a>
    </div>
  </div>
</div>

{% endblock %}
